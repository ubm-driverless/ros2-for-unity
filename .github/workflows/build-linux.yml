name: Build ros2-for-unity (Linux/Jazzy)

on:
  push:
    branches: [ubm/jazzy]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    container:
      image: ros:jazzy
    steps:
      - name: Configure git safe.directory
        run: git config --global --add safe.directory "*"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build deps
        shell: bash
        run: |
          set -eux
          apt-get update
          apt-get install -y --no-install-recommends \
            python3-vcstool \
            python3-colcon-common-extensions \
            patchelf \
            wget \
            ca-certificates \
            git
          # .NET 8 SDK from Microsoft
          wget -q https://packages.microsoft.com/config/ubuntu/24.04/packages-microsoft-prod.deb -O /tmp/ms.deb
          dpkg -i /tmp/ms.deb
          apt-get update
          apt-get install -y --no-install-recommends dotnet-sdk-8.0

      - name: Pull repositories
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          set -ex
          ./pull_repositories.sh

      - name: Build standalone
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          set -ex
          ./build.sh --standalone

      - name: Inspect build output
        if: always()
        shell: bash
        run: |
          set +e
          echo "=== install/asset/Ros2ForUnity ==="
          ls -la install/asset/Ros2ForUnity/ 2>&1 || true
          echo "=== Plugins tree (top 50) ==="
          find install/asset/Ros2ForUnity/Plugins -maxdepth 4 -type f 2>/dev/null | head -50 || true

      - name: Upload Ros2ForUnity artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ros2-for-unity-linux-jazzy
          path: install/asset/Ros2ForUnity/
          retention-days: 30
          if-no-files-found: error

      - name: Upload colcon log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: colcon-log
          path: log/
          retention-days: 14
          if-no-files-found: ignore
